version: '3.9'

services:
    redis:
        container_name: 'redis-db'
        image: 'redis'
        ports:
            - '6379:6379'
        volumes:
            - 'redisvol:/data'
            - './redis/redis.conf:/usr/local/etc/redis/redis.conf'
        # entrypoint: 'redis-server /usr/local/etc/redis/redis.conf'
volumes:
    redisvol:
        driver: local