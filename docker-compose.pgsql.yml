services:
    pgsql:
        container_name: 'pgsql-local'
        image: 'postgres:latest'
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: 'test_db'
            POSTGRES_USER: 'root'
            POSTGRES_PASSWORD: 'secret*098'
            PGDATA: /var/lib/postgresql/data
        volumes:
            - 'pgsqlvol:/var/lib/postgresql/data'
            - './pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
            - './pgsql/postgresql.conf:/etc/postgresql/postgresql.conf'
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - 'test_db'
                - '-U'
                - 'root'
            retries: 3
            timeout: 5s
        restart: unless-stopped
        #command: postgres -c config_file=/etc/postgresql/postgresql.conf
volumes:
    pgsqlvol: